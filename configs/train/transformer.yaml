experiment_name: "Transformer"

preprocessing:
  confidence_threshold: 0.4
  exclude_ratio: 0.1
  min_segment_length: 60
  outlier_ratio: 0.2

  # Butterworth filter params
  filter_cutoff: 6
  filter_order: 4

data:
  # Relative path from PROJECT_ROOT
  dataset_root: "dataset/PROCESSED/rtmlib"
  annotation_root: "annotations"
  framerate: 60

  skeleton: "HALPE"
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  num_workers: 0

  features:
    keypoints:
      - "HIP"
      - "LEFT_HIP"
      - "RIGHT_HIP"
      - "LEFT_KNEE"
      - "RIGHT_KNEE"
      - "LEFT_ANKLE"
      - "RIGHT_ANKLE"
      - "LEFT_HEEL"
      - "RIGHT_HEEL"
      - "LEFT_FOOT_INDEX"
      - "RIGHT_FOOT_INDEX"
      - "LEFT_SHOULDER"
      - "RIGHT_SHOULDER"
    kinematics:
      - "HIP"
      - "LEFT_HIP"
      - "RIGHT_HIP"
      - "LEFT_KNEE"
      - "RIGHT_KNEE"
      - "LEFT_ANKLE"
      - "RIGHT_ANKLE"
      - "LEFT_HEEL"
      - "RIGHT_HEEL"
      - "LEFT_FOOT_INDEX"
      - "RIGHT_FOOT_INDEX"
    angles:
      - ["LEFT_HIP", "LEFT_KNEE", "LEFT_ANKLE"]
      - ["RIGHT_HIP", "RIGHT_KNEE", "RIGHT_ANKLE"]
      - ["LEFT_ANKLE", "LEFT_HEEL", "LEFT_FOOT_INDEX"]
      - ["RIGHT_ANKLE", "RIGHT_HEEL", "RIGHT_FOOT_INDEX"]
      - ["LEFT_SHOULDER", "LEFT_HIP", "LEFT_KNEE"]
      - ["RIGHT_SHOULDER", "RIGHT_HIP", "RIGHT_KNEE"]
    distances:
      - ["HIP", "LEFT_HEEL"]
      - ["HIP", "RIGHT_HEEL"]
      - ["HIP", "LEFT_FOOT_INDEX"]
      - ["HIP", "RIGHT_FOOT_INDEX"]
      - ["LEFT_KNEE", "RIGHT_KNEE"]

model:
  type: "GaitTransformer"
  params:
      d_model: 256           # Embedding size
      n_head: 8              # Number of attention heads
      num_layers: 2          # Number of encoder layers (depth)
      dim_feedforward: 512   # Expansion factor for MLP
      dropout: 0.13
      kernel_size: 21
      padding: 10             # (kernel_size // 2)
      num_classes: 4

training:
  optimizer: "AdamW"
  f1_window_size_ms: 50
  learning_rate: 0.0016
  weight_decay: 0.000018
  momentum: 0.9
  batch_size: 16
  epochs: 100
  seed: 3               # Training/Validation split seed
  noise_std: 0.05       # Data augmentation noise

  # Optional scheduler config
  scheduler: "OneCycleLR"
  scheduler_config:
    pct_start: 0.3            # warmup
    div_factor: 25.0          # start_lr = max_lr / div_factor
    final_div_factor: 10000.0 # final_lr = max_lr / final_div_factor
    anneal_strategy: "cos"    # cos | linear