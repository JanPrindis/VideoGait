experiment_name: "Benchmark_Ghoussayni_Baseline_1"
output_dir: "benchmarkResults/ghoussayni_001"

preprocessing:
  framerate: 60
  confidence_threshold: 0.4
  exclude_ratio: 0.1
  min_segment_length: 60
  outlier_ratio: 0.2

  use_filter: true    # Use Butterworth filter for smoothing

  # Butterworth filter params
  filter_cutoff: 6
  filter_order: 4

event_detector:
  method: "Heuristic" # "NeuralNet" or "Heuristic"

  neural_net:
    experiment_path: "experiments/LSTM_Baseline_Halpe"
    checkpoint: "best_model.pth"

    post_processing:
      threshold: 0.6
      min_distance_sec: 0.25

  heuristic:
    method: "Ghoussayni"
    skeleton: "HALPE"
    seed: 3
    train_split: 0.8
    params:
      # If null, ratio is used. If number (e.g. 50), it is used as fixed threshold (cm/s).
      velocity_threshold: null
      velocity_threshold_ratio: 0.35 # % of max movement speed

      # Butterworth filter config for smoothing data for velocity calculation
      velocity_filter_cutoff: 6
      velocity_filter_order: 2

data:
  dataset_root: "dataset/PROCESSED/rtmlib"
  annotation_root: "annotations"

  # If true, the whole dataset is used, if false, only the validation part of the seed is used.
  use_full_dataset: False

evaluation:
  strict_tolerance_ms: 50
  loose_tolerance_ms: 150
